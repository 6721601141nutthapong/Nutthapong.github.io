<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Night 3D World</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #02030d;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- GLTFLoader สำหรับโหลดไฟล์ .glb / .gltf -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // =========================================
        // 1. Renderer
        // =========================================

        const renderer = new THREE.WebGLRenderer({
            antialias: true
        });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        document.body.appendChild(renderer.domElement);


        // =========================================
        // 2. Scene - โลกกลางคืน
        // =========================================

        const scene = new THREE.Scene();

        // ท้องฟ้าสีน้ำเงินเข้มแบบกลางคืน
        scene.background = new THREE.Color(0x02030d);

        // หมอกจาง ๆ เพื่อเพิ่มบรรยากาศในระยะไกล
        scene.fog = new THREE.Fog(0x02030d, 35, 140);


        // =========================================
        // 3. Camera
        // =========================================

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        camera.position.set(12, 10, 15);
        camera.lookAt(0, 0, 0);


        // =========================================
        // 4. OrbitControls
        // =========================================

        const controls = new THREE.OrbitControls(
            camera,
            renderer.domElement
        );

        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.target.set(0, 0, 0);


        // =========================================
        // 5. แสงกลางคืน
        // =========================================

        const ambientLight = new THREE.AmbientLight(
            0x27345f,
            0.5
        );

        scene.add(ambientLight);

        // แสงสีน้ำเงินอ่อนจากด้านบน
        const moonLight = new THREE.DirectionalLight(
            0x8faeff,
            0.8
        );

        moonLight.position.set(-15, 25, -25);
        moonLight.castShadow = true;
        moonLight.shadow.mapSize.width = 1024;
        moonLight.shadow.mapSize.height = 1024;

        scene.add(moonLight);


        // =========================================
        // 6. พระจันทร์
        // =========================================

        const moonGeometry = new THREE.SphereGeometry(
            5,
            48,
            48
        );

        const moonMaterial = new THREE.MeshBasicMaterial({
            color: 0xe5eaff
        });

        const moon = new THREE.Mesh(
            moonGeometry,
            moonMaterial
        );

        // วางพระจันทร์ไว้ด้านหลังโลก
        moon.position.set(-18, 24, -38);

        scene.add(moon);


        // วงแสงรอบพระจันทร์แบบโปร่งใส
        const moonGlowGeometry = new THREE.SphereGeometry(
            5.8,
            32,
            32
        );

        const moonGlowMaterial = new THREE.MeshBasicMaterial({
            color: 0x6f8edb,
            transparent: true,
            opacity: 0.08,
            side: THREE.BackSide
        });

        const moonGlow = new THREE.Mesh(
            moonGlowGeometry,
            moonGlowMaterial
        );

        moonGlow.position.copy(moon.position);

        scene.add(moonGlow);


        // =========================================
        // 7. ดาวบนท้องฟ้า
        // =========================================

        const starCount = 700;
        const starPositions = [];

        for (let i = 0; i < starCount; i++) {
            const x = (Math.random() - 0.5) * 180;
            const y = Math.random() * 70 + 8;
            const z = (Math.random() - 0.5) * 180;

            starPositions.push(x, y, z);
        }

        const starGeometry = new THREE.BufferGeometry();

        starGeometry.setAttribute(
            'position',
            new THREE.Float32BufferAttribute(
                starPositions,
                3
            )
        );

        const starMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.18,
            sizeAttenuation: true
        });

        const stars = new THREE.Points(
            starGeometry,
            starMaterial
        );

        scene.add(stars);


        // =========================================
        // 8. พื้นตารางเดิม
        // =========================================

        const gridSize = 100;
        const gridDivisions = 100;

        const gridHelper = new THREE.GridHelper(
            gridSize,
            gridDivisions,
            0x405080,
            0x18213d
        );

        gridHelper.position.y = 0;

        scene.add(gridHelper);


        // =========================================
        // 9. พื้นรองรับสีเข้ม
        // =========================================

        const floorGeometry = new THREE.PlaneGeometry(
            gridSize,
            gridSize
        );

        const floorMaterial = new THREE.MeshStandardMaterial({
            color: 0x050711,
            roughness: 1,
            metalness: 0
        });

        const floor = new THREE.Mesh(
            floorGeometry,
            floorMaterial
        );

        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.02;
        floor.receiveShadow = true;

        scene.add(floor);


        // =========================================
        // 10. โหลดโมเดล 3D (Garage1.glb)
        // =========================================

        const loader = new THREE.GLTFLoader();
        const modelUrl = 'https://raw.githubusercontent.com/6721601141nutthapong/Nutthapong.github.io/main/3D/Garage1.glb';

        loader.load(
            modelUrl,
            (gltf) => {
                const model = gltf.scene;

                // เปิดให้โมเดลรับและทอดเงา
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                // กำหนดตำแหน่ง ขนาด และการหมุนของโมเดล
                model.position.set(0, 0, 0);
                model.scale.set(1, 1, 1); // สามารถปรับขนาดได้ที่นี่ เช่น (0.5, 0.5, 0.5)

                scene.add(model);
                console.log('โหลดโมเดล Garage1.glb สำเร็จ!');
            },
            (xhr) => {
                // แสดงความคืบหน้าการโหลด
                console.log((xhr.loaded / xhr.total * 100) + '% loaded');
            },
            (error) => {
                // แสดงข้อผิดพลาดหากโหลดไม่สำเร็จ
                console.error('เกิดข้อผิดพลาดในการโหลดโมเดล:', error);
            }
        );


        // =========================================
        // 11. Resize
        // =========================================

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );
        });


        // =========================================
        // 12. Animation Loop
        // =========================================

        function animate() {
            requestAnimationFrame(animate);

            controls.update();

            renderer.render(scene, camera);
        }

        animate();

    </script>

</body>

</html>
